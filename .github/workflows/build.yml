name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Portable checks
        run: bash Scripts/test.sh
      - name: Build app
        run: bash Scripts/build_local.sh
      - name: Archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/DSHMeter.app dist/DSHMeter-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DSHMeter-macOS
          path: dist/DSHMeter-macOS.zip
